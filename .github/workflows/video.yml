name: video
on:
  push:
    branches: [video-test]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Install software GL and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg libgl1-mesa-dri libglx-mesa0 libegl1 mesa-vulkan-drivers libxrandr2 libxinerama1 libxcursor1 libxi6
      - name: Record gametest
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
          WITCH_VIDEO: "1"
        run: |
          mkdir -p out
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 3
          export DISPLAY=:99
          ffmpeg -loglevel error -f x11grab -video_size 1280x720 -framerate 15 -i :99 -c:v libx264 -preset veryfast -crf 30 -pix_fmt yuv420p out/witch-video.mp4 &
          FF=$!
          set -o pipefail
          gradle runClientGametest --stacktrace 2>&1 | tee video.log || true
          kill -INT $FF || true
          wait $FF || true
          tail -1500 video.log > out/video-tail.log
          grep -n -E "What went wrong|FAILURE|Exception|Caused by|error:|Error" video.log | head -30 | while IFS= read -r l; do echo "::notice::$l"; done
          ls -la out
          rm -rf /tmp/vid-repo; mkdir -p /tmp/vid-repo; cp out/* /tmp/vid-repo/ || true
          cd /tmp/vid-repo
          git init -q; git checkout -q -b video-out
          git config user.name ci; git config user.email ci@example.com
          git add -A; git commit -q -m video || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q -f origin video-out || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video
          path: out/*
