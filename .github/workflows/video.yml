name: video
on:
  push:
    branches: [video-test]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Install software GL and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg libgl1-mesa-dri libglx-mesa0 libegl1 mesa-vulkan-drivers libxrandr2 libxinerama1 libxcursor1 libxi6
      - name: Record gametest
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
          WITCH_VIDEO: "1"
        run: |
          mkdir -p out frames
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" gradle runClientGametest --stacktrace 2>&1 | tee video.log || true
          find . -path ./frames -prune -o -name "*.png" -path "*screenshots*" -print | sort > list.txt
          wc -l list.txt
          n=0; while IFS= read -r f; do n=$((n+1)); cp "$f" "frames/$(printf '%05d' $n).png"; done < list.txt
          ffmpeg -loglevel error -framerate 10 -i frames/%05d.png -c:v libx264 -preset veryfast -crf 28 -pix_fmt yuv420p out/witch-video.mp4 || true
          cp frames/00001.png out/first.png || true
          tail -1500 video.log > out/video-tail.log
          grep -n -E "What went wrong|FAILURE|Exception|Caused by|error:|Error" video.log | head -30 | while IFS= read -r l; do echo "::notice::$l"; done
          ls -la out
          rm -rf /tmp/vid-repo; mkdir -p /tmp/vid-repo; cp out/* /tmp/vid-repo/ || true
          cd /tmp/vid-repo
          git init -q; git checkout -q -b video-out
          git config user.name ci; git config user.email ci@example.com
          git add -A; git commit -q -m video || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q -f origin video-out || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video
          path: out/*
