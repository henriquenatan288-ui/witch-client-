plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

def witchEdition = (findProperty('edition') ?: 'light').toString().toLowerCase()

base {
	archivesName = project.archives_base_name + '-' + witchEdition
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// decodificador de MP3 (puro Java), embutido no jar
	implementation "com.googlecode.soundlibs:jlayer:1.0.1.4"
	include "com.googlecode.soundlibs:jlayer:1.0.1.4"
}

loom {
	mods {
		"witch" {
			sourceSet sourceSets.main
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "witch-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "edition", witchEdition
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
	filesMatching("witch_edition.properties") {
		expand "edition": witchEdition
	}
	// beta: sem fonte global, sem texturas de itens e sem sol/lua novos (so Light e Full)
	if (witchEdition == 'beta') {
		exclude 'assets/minecraft/**'
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}